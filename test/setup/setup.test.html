<!DOCTYPE html>
<html>
  <body>
    <script type="module">
      /* eslint-env mocha */
      import { runTests } from '@web/test-runner-mocha';
      import { expect } from '@esm-bundle/chai';
      import { setup } from '../../src/setup.js';

      runTests(() => {
        it('setup - defines window.hlx', () => {
          setup();

          expect(window.hlx).to.not.be.null;
        });

        it('setup - does not override existing variables', () => {
          window.hlx = {
            custom: 'keep it',
          };

          setup();
          expect(window.hlx).to.not.be.null;
          expect(window.hlx.custom).to.be.equal('keep it');
        });

        it('setup - sets codeBasePath from the given import URL', () => {
          setup('https://aem.live/foo/scripts/aem.js');
          expect(window.hlx.codeBasePath).to.equal('/foo');
        });

        it('setup - sets codeBasePath to the full pathname when /scripts/ is not present', () => {
          setup('https://aem.live/foo/bar.js');
          expect(window.hlx.codeBasePath).to.equal('/foo/bar.js');
        });

        it('setup - defaults to import.meta.url when no importUrl is given', () => {
          setup();
          expect(window.hlx.lighthouse).to.be.false;
        });
      });
    </script>
  </body>
</html>
